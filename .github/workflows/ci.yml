# PR / push CI for the operator CLI. Gate is CLI-only (no Vite/ESLint/vitest/IPC).
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  cli:
    name: CLI gate (test:cli)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: pageseeds-cli

      - name: Install package scripts
        run: pnpm install

      - name: Run CLI ship gate
        run: pnpm run test:cli
